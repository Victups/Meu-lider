version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: igreja_escala_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: igreja_escala
      TZ: UTC
    # High host port: native Windows PostgreSQL services already hold 5432 and 5433.
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - igreja_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: igreja_escala_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - igreja_network

  redis:
    image: redis:7-alpine
    container_name: igreja_escala_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - igreja_network

volumes:
  postgres_data:
  redis_data:

networks:
  igreja_network:
    driver: bridge
